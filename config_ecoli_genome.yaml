# ============================================================================
# dichromat pipeline config — E. coli GLORI m6A, GENOME-ONLY single layer
#
# Uses the genome-only prismalign pipeline (``pipeline_genome_only.yaml``),
# MK scheme (A->G + C->T), single bwa-mem2 genome layer.  No contamination /
# genes / transcript layers.
# ============================================================================

container: "development/dichromat.sif"
batch: "ecoli_genome"

# Mapping layers (single genome layer; the Snakefile generates the prismalign
# pipeline YAML from this block).
mapping:
  threads: 128
  index_dir: internal_files/ref/map_index
  layers:
    - key: genome
      role: post
      site: true
      engine: bwa-mem2
      scheme: MK
      mutation_classes:
        - name: A_to_G
          source: A
          target: G
        - name: C_to_T
          source: C
          target: T
      filter:
        min_mapping_ratio: 0.8
        max_conversion_rates: [1.0, 0.33]
      em: true

base_change: 'A,G'
secondary_change: 'C,T'
splice_genome: false
depth_site: true

reference:
  - key: genome
    fa: /data/project/changye/chye/projects/m6A_new/workspaces/workspace_ecoli_glori_genome/ref/genome.fa
    gtf: /data/project/changye/chye/projects/m6A_new/workspaces/workspace_ecoli_glori_genome/ref/genome.gtf.gz

samples:
  Rep1:
    data:
      - R1: /data/project/changye/chye/projects/m6A_new/workspaces/workspace_ecoli_glori_genome/Rep1.fastq
    adapter: "GACGTGTGCTCTTCCGATCTNNNNNNNNXXXXXX+XXXAGATCGGAAGAGCGTCGTGT"
