# This workflow builds a SIF container on every push to the main branch,
# pushes the underlying Docker image to GHCR, and uploads the SIF to a
# 'nightly-build' pre-release so users can wget it directly.
name: Build and Release SIF Container (Nightly)

on:
  push:
    branches:
      - 'main' # Trigger on every push to the 'main' branch

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create/update releases
      packages: write # Required to push to GitHub Container Registry

    steps:
      # 1. Get the source code and initialize submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Get the short commit SHA to use as a label for traceability
      - name: Get commit SHA for versioning
        id: get_version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to the GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push the Docker image to GHCR, tagged only as 'latest'
      - name: Build and push Docker image
        id: build_and_push_docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dichromat:latest
          # Version label kept for traceability.
          labels: org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}

      # 6. Install a specific version of Apptainer
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # 7. Build the SIF container from the 'latest' Docker image
      - name: Build SIF from Docker image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIF_FILENAME: dichromat.sif
          DOCKER_IMAGE_URI: docker://ghcr.io/${{ github.repository_owner }}/dichromat:latest
        run: |
          echo "Building SIF file: $SIF_FILENAME"
          apptainer build "$SIF_FILENAME" "$DOCKER_IMAGE_URI"
          echo "SIF_FILE_PATH=$SIF_FILENAME" >> $GITHUB_ENV

      # 7.5 Smoke-test the freshly-built SIF before it is allowed to publish.
      #   - runs the critical runtime imports/tools (polars is the one that
      #     silently broke before), and
      #   - executes a real falco QC -> report_html round-trip inside the SIF.
      - name: Smoke-test the SIF
        run: |
          set -euo pipefail
          echo "--- tool versions (non-login shell = image runtime PATH) --------"
          apptainer exec -B "$PWD":/workspace -W /workspace dichromat.sif bash -c '
            set -e
            echo "  PATH=$PATH"
            echo "  which python: $(command -v python)"
            python -c "import polars as pl, scipy, numpy, pysam; print(\"  python imports OK (polars\", pl.__version__ + \")\")"
            snakemake --version
            falco --version | head -1
            countmut --version
            coralsnake --version
            cutseq --version | head -1
            samtools --version | head -1
            [ -x /pipeline/entrypoint ] && echo "  entrypoint present"
            python /pipeline/src/report_html.py --help >/dev/null && echo "  report-ok"
          '
          echo "--- real falco -> report_html round-trip (inside SIF) ---"
          apptainer exec -B "$PWD":/workspace -W /workspace dichromat.sif bash -c '
            set -e
            mkdir -p smoke && cd smoke
            for i in $(seq 1 300); do
              printf "@r%s\nACGTACGTACGTACGTACGTACGTACGTACGT\n+\nIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\n" "$i"
            done | gzip -c > smoke.fq.gz
            falco -o qc smoke.fq.gz >/dev/null
            python /pipeline/src/report_html.py qc qc.html "$(ls qc/*/fastqc_data.txt)"
            [ -s qc.html ] && echo "  qc.html OK ($(du -h qc.html | cut -f1))"
          '

      # 8. Create or update a "Nightly Build" pre-release and upload the new SIF file
      - name: Create or Update Nightly Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'nightly-build'
          name: 'Nightly Build'
          body: |
            This pre-release contains the latest development build from the `main` branch.

            **Last Updated:** $(date -u)
            **Commit:** `${{ github.sha }}`

            **Container Images:**
            - **SIF:** `${{ env.SIF_FILE_PATH }}` (attached below)
            - **Docker:** `ghcr.io/${{ github.repository_owner }}/dichromat:latest`
          prerelease: true
          files: ${{ env.SIF_FILE_PATH }}
