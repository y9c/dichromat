# This workflow builds a SIF container on every push to the main branch,
# pushes the underlying Docker image to GHCR, and uploads the SIF to a
# 'nightly-build' pre-release so users can wget it directly.
name: Build and Release SIF Container (Nightly)

on:
  push:
    branches:
      - 'main' # Trigger on every push to the 'main' branch

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create/update releases
      packages: write # Required to push to GitHub Container Registry

    steps:
      # 1. Get the source code and initialize submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Get the short commit SHA to use as a label for traceability
      - name: Get commit SHA for versioning
        id: get_version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to the GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push the Docker image to GHCR, tagged only as 'latest'
      - name: Build and push Docker image
        id: build_and_push_docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dichromat:latest
          # Version label kept for traceability.
          labels: org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}

      # 6. Install a specific version of Apptainer
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # 7. Build the SIF container from the 'latest' Docker image
      - name: Build SIF from Docker image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIF_FILENAME: dichromat.sif
          DOCKER_IMAGE_URI: docker://ghcr.io/${{ github.repository_owner }}/dichromat:latest
        run: |
          echo "Building SIF file: $SIF_FILENAME"
          apptainer build "$SIF_FILENAME" "$DOCKER_IMAGE_URI"
          echo "SIF_FILE_PATH=$SIF_FILENAME" >> $GITHUB_ENV

      # 8. Create or update a "Nightly Build" pre-release and upload the new SIF file
      - name: Create or Update Nightly Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'nightly-build'
          name: 'Nightly Build'
          body: |
            This pre-release contains the latest development build from the `main` branch.

            **Last Updated:** $(date -u)
            **Commit:** `${{ github.sha }}`

            **Container Images:**
            - **SIF:** `${{ env.SIF_FILE_PATH }}` (attached below)
            - **Docker:** `ghcr.io/${{ github.repository_owner }}/dichromat:latest`
          prerelease: true
          files: ${{ env.SIF_FILE_PATH }}

      # 9. (Optional) Auto-publish the SIF to Zenodo for China-friendly downloads.
      #    Zenodo is generally accessible from mainland China (unlike GitHub).
      #    Requires two repository secrets:
      #      - ZENODO_TOKEN:        Zenodo personal access token (deposit:write + deposit:actions)
      #      - ZENODO_DEPOSITION_ID: the Zenodo deposition ID of the dichromat record
      #    If either secret is missing the step skips cleanly (no-op), so the
      #    workflow remains usable by forks/contributors without the secrets.
      - name: Check Zenodo configuration
        id: zenodo_guard
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
        run: |
          if [ -z "$ZENODO_TOKEN" ] || [ -z "$ZENODO_DEPOSITION_ID" ]; then
            echo "Zenodo not configured (missing ZENODO_TOKEN / ZENODO_DEPOSITION_ID secrets). Skipping Zenodo publish."
            echo "configured=false" >> "$GITHUB_ENV"
          else
            echo "configured=true" >> "$GITHUB_ENV"
          fi

      - name: Publish SIF to Zenodo
        if: env.configured == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
          SIF_FILE_PATH: ${{ env.SIF_FILE_PATH }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          BASE="https://zenodo.org/api/deposit/depositions"
          AUTH="Authorization: Bearer ${ZENODO_TOKEN}"

          # 1. Create a new version draft (inherits previous files)
          NEWVERSION=$(curl -sf -X POST -H "$AUTH" "$BASE/$ZENODO_DEPOSITION_ID/actions/newversion")
          NEW_DRAFT_URL=$(echo "$NEWVERSION" | jq -r '.links.latest_draft')
          DRAFT=$(curl -sf -H "$AUTH" "$NEW_DRAFT_URL")
          NEW_ID=$(echo "$DRAFT" | jq -r '.id')
          BUCKET=$(echo "$DRAFT" | jq -r '.links.bucket')

          # 2. Remove any previous dichromat.sif copied into the new draft
          OLD_FILE_ID=$(echo "$DRAFT" | jq -r --arg f "dichromat.sif" '.files[]? | select(.filename==$f) | .id')
          if [ -n "$OLD_FILE_ID" ] && [ "$OLD_FILE_ID" != "null" ]; then
            curl -sf -X DELETE -H "$AUTH" "$BASE/$NEW_ID/files/$OLD_FILE_ID"
          fi

          # 3. Upload the freshly built SIF
          curl -sf -H "$AUTH" --upload-file "$SIF_FILE_PATH" "$BUCKET/dichromat.sif"

          # 4. Update the version metadata
          VERSION_STR="nightly-${VERSION}"
          curl -sf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"metadata\":{\"version\":\"${VERSION_STR}\"}}" \
            "$BASE/$NEW_ID"

          # 5. Publish the new version
          curl -sf -X POST -H "$AUTH" "$BASE/$NEW_ID/actions/publish"
          echo "Published dichromat.sif (${VERSION_STR}) to Zenodo."
