# Pipeline Logic
# The GC-background site filter (filter_sites) is always applied and always
# writes report_sites/filtered.tsv; is_etam no longer gates it.
skip_samples: []

path:
  python: "python"
  samtools: "samtools"
  hisat3n: "hisat-3n"
  hisat3nbuild: "hisat-3n-build"
  cutseq: "cutseq"
  falco: "falco"
  bgzip: "bgzip"
  markdup: "markdup"
  variant: "variant"
  report_html: "/opt/app_venv/bin/python /pipeline/src/report_html.py"
  coralsnake: "coralsnake"
  prismalign: "prismalign"
  countmut: "countmut"
  # Python scripts (use venv Python with installed packages)
  bam_tag: "/opt/app_venv/bin/python /pipeline/src/bam_tag.py"
  bam_conv: "/opt/app_venv/bin/python /pipeline/src/bam_conv.py"
  merge_samples: "/opt/app_venv/bin/python /pipeline/src/merge_samples.py"
  remap_genome: "/opt/app_venv/bin/python /pipeline/src/remap_genome.py"
  filter_sites: "/opt/app_venv/bin/python /pipeline/src/filter_sites.py"
  sum_groups: "/opt/app_venv/bin/python /pipeline/src/sum_groups.py"
  motif_enrich: "/opt/app_venv/bin/python /pipeline/src/motif_enrich.py"
  mqc_mapping: "/opt/app_venv/bin/python /pipeline/src/mqc_mapping.py"
  mqc_sites: "/opt/app_venv/bin/python /pipeline/src/mqc_sites.py"

min_len: 20
# Alignment parameters for the main mapping step.
#   min_mapping_ratio: fraction of the read that must align (0.8 default).
#   max_mismatches:    max mismatches tolerated (6 default; lower rejects more
#                      C->T background for the A2G-only case, but MK models it).
min_mapping_ratio: 0.8
max_mismatches: 2
markdup: true
splice_genome: true
splice_contamination: false
pileup_ct: false
depth_site: false
secondary_change: ""

# Minimum depth for sites to be included in merged output
# Lower values include more sites but may increase noise
min_merged_depth: 1

# prismalign mapping layers (order = priority).  The Snakefile derives the
# active reftypes from this block and generates the prismalign pipeline YAML
# (rule generate_pipeline_config) that prismalign consumes.  A genome-only run
# (e.g. bacteria) overrides this with just the `genome` layer.
mapping:
  threads: 128
  index_dir: internal_files/ref/map_index
  layers:
    # ---- contamination removal (hisat3n, self-converting) ----
    - key: contamination
      role: pre
      engine: hisat3n
      scheme: PLAIN              # hisat3n self-converts A->G; engine feeds original reads
      mutation_classes:
        - name: A_to_G
          source: A
          target: G
        - name: C_to_T
          source: C
          target: T
      engine_kwargs:
        no_splice: true
        extra_args: "--np 0 --rdg 5,3 --rfg 5,3 --sp 9,3 --mp 3,1 --score-min L,-2,-0.8"
      filter:
        pre_gate: {}             # contamination gate (min_softclip=30, xm_factor=15)

    # ---- main map - genes (bwa-mem2, MK; masking layer, claims first) ----
    - key: genes
      role: main
      engine: bwa-mem2
      scheme: MK
      ref_strand: fwd
      filter:
        min_mapping_ratio: 0.8
        max_conversion_rates: [1.0, 0.33]
      em: true

    # ---- main map - transcript (bwa-mem2, MK) ----
    - key: transcript
      role: main
      site: true
      engine: bwa-mem2
      scheme: MK
      ref_strand: fwd
      filter:
        min_mapping_ratio: 0.8
        max_conversion_rates: [1.0, 0.33]

    # ---- genome rescue (hisat3n, spliced) ----
    - key: genome
      role: post
      site: true
      engine: hisat3n
      scheme: PLAIN
      splice: true
      mutation_classes:
        - name: A_to_G
          source: A
          target: G
        - name: C_to_T
          source: C
          target: T
      engine_kwargs:
        extra_args: "--avoid-pseudogene --np 0 --rdg 5,3 --rfg 5,3 --sp 9,3 --mp 3,1 --score-min L,-3,-0.5"
      filter:
        max_nm_ratio: 0.08
      em: true
