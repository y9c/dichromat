container: "development/dichromat.sif"

# Mapping layers (the Snakefile generates the prismalign pipeline YAML from
# this block).  This example uses a single genome layer; add contamination /
# genes / transcript layers as needed.
mapping:
  threads: 128
  index_dir: internal_files/ref/map_index
  layers:
    - key: genome
      role: post
      site: true
      engine: hisat3n
      scheme: PLAIN
      mutation_classes:
        - name: A_to_G
          source: A
          target: G
        - name: C_to_T
          source: C
          target: T
      filter:
        max_nm_ratio: 0.08
      em: true

reference:
  - key: genome
    fa: ~/reference/genome/Homo_sapiens/GRCh38.fa
    gtf: ~/reference/genome/Homo_sapiens/GRCh38.release110.gtf

samples:
  sample1:
    data:
      - R1: ~/scratch/debug.fq.gz
    adapter: "GACGTGTGCTCTTCCGATCTNNNNNNNNXXXXXX-XXXAGATCGGAAGAGCGTCGTGT"